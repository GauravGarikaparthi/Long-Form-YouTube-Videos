name: Generate Long-Form AI Video

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Video topic / thesis"
        required: true
        default: "The future of artificial intelligence in healthcare"
        type: string
      llm_provider:
        description: "LLM provider for script generation"
        required: false
        default: "gemini"
        type: choice
        options:
          - gemini
          - claude
          - groq
      image_gen_provider:
        description: "Image generation provider"
        required: false
        default: "replicate_flux"
        type: choice
        options:
          - replicate_flux
          - together_flux
      tts_provider:
        description: "Text-to-speech provider"
        required: false
        default: "edge_tts"
        type: choice
        options:
          - elevenlabs
          - edge_tts
      video_gen_provider:
        description: "Video generation / animation provider"
        required: false
        default: "replicate"
        type: choice
        options:
          - replicate
          - together
          - huggingface
      target_duration_seconds:
        description: "Target total video length (seconds)"
        required: false
        default: "180"
        type: string
      resolution:
        description: "Target resolution e.g. 1920x1080"
        required: false
        default: "1920x1080"
        type: string
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: write

jobs:
  generate-video:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: ${{ github.event.inputs.llm_provider || 'gemini' }}
      IMAGE_GEN_PROVIDER: ${{ github.event.inputs.image_gen_provider || 'replicate_flux' }}
      TTS_PROVIDER: ${{ github.event.inputs.tts_provider || 'edge_tts' }}
      VIDEO_GEN_PROVIDER: ${{ github.event.inputs.video_gen_provider || 'replicate' }}
      TARGET_DURATION_SECONDS: ${{ github.event.inputs.target_duration_seconds || '180' }}
      RESOLUTION: ${{ github.event.inputs.resolution || '1920x1080' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
      REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
      TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
      HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
      LOG_LEVEL: INFO
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI video pipeline
        id: pipeline
        env:
          TOPIC: ${{ github.event.inputs.topic || 'The future of artificial intelligence in healthcare' }}
        run: |
          python orchestrator.py

      - name: Upload final video artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: output/final_video.mp4
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload pipeline logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs
          path: work/*.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit generated assets back to repo
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ work/ || true
          git diff --cached --quiet || git commit -m "chore(ai-video): add generated video and assets [skip ci]"
          git push
